metadata:
  name: TEF design optimisation (S x tether stress per generator limit)

base_config_dir: config/base
results_dir: results/design_optimisation

# Generator mechanical power limit on the outer axis (the QSM max_power
# cap). The design is optimised at each; the rated cycle power emerges.
generator_max_power_w: [40000.0, 80000.0, 150000.0, 250000.0, 400000.0]

# Optimised inner design variables and their inclusive bounds. A single
# absolute area band cannot fit every generator (the matched wing grows
# with the generator), so widen or run per-generator if an optimum rails
# a bound. The tether-stress band mirrors the AWE-SE constant-sigma range.
variables:
  - {name: flat_area_m2, lower: 18.0, upper: 400.0}
  - {name: allowable_tether_stress_pa, lower: 2.0e+8, upper: 6.0e+8}

# Full-factorial grid per variable. The grid is the primary optimiser and
# also the LCoE surface for plotting.
grid_points:
  flat_area_m2: 6
  allowable_tether_stress_pa: 5

# Fixed design fields shared by every case.
design_defaults:
  max_tether_speed_m_s: 10.0
  tether_length_m: 500.0

# Optional local refinement of the best grid cell (needs scipy):
#   none | nelder_mead | slsqp
refine:
  method: none

execution:
  run_storage_sizing: true
  overwrite: true
